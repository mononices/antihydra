[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antihydra-solver"
version = "0.1.0"
description = "Independent LLM CTF solver for CSAW/NYU-style challenges"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["antihydra*"]

[tool.black]
# competition/ holds third-party challenge data: never reformat it, even when a
# path is passed explicitly (force-exclude).
extend-exclude = "(^|/)competition/"
force-exclude = true
