# Corrections for defects in the shipped challenge data.
#
# competition/ is read-only: never edit, move, or delete dataset files. Fix-ups
# live here and are applied at load time by antihydra/challenge.py.
#
# Keys are "<category>/<directory name>" (the directory, not the metadata name,
# so a wrong name field cannot hide an entry). Allowed fields are "files" and
# "name"; a flag can never be overridden. A key that matches no challenge warns,
# and a listed file that does not exist fails the run instead of silently
# handing the agent an empty challenge.

["crypto/manual-distress-signal"]
# challenge.json lists "dist/scrambled", which is echoes-of-DES-tiny's artifact;
# this directory ships no dist/. The flag is hardcoded as SERVER_SECRET in
# infra/app.js, so delivering any file here would leak it: this challenge is
# network-only (black-box the HTTP length oracle).
files = []

["pwn/mooneys-bookstore"]
# challenge.json lists "infra/chal". "chal" is the container WORKDIR in
# infra/Dockerfile ("WORKDIR /chal", "COPY ./overflow_me ...", run via socat),
# not the handout filename: the shipped binary is infra/overflow_me. The other
# pwn challenges do ship a binary literally named "infra/chal", which is how
# this entry was probably copied.
files = ["infra/overflow_me"]

["web/gradebook"]
# The metadata name was copy-pasted from pwn/power-up and collides with it,
# which makes --challenge "power-up" ambiguous and lets name-keyed summary.json
# results overwrite each other. Directory name is the stable identity.
name = "gradebook"
