# Lane roster for race.py. Edit freely.
#
#   python race.py --challenge arm-strong
#
# race.py uses this file automatically when no --lanes/--lanes-file is given.
# Precedence per field: lane entry > CLI flag > [defaults] > built-in fallback.
# reasoning_effort values: none, minimal, low, medium, high, xhigh, max.

[defaults]
temperature = 0.7
reasoning_effort = "max"
max_cost = 0.6
max_rounds = 1000
no_subtasks = false
# Flag crib in the prompt: "generic" describes its shape (keeps the event name
# out of the prompt; --flag-hint branded prints the literal prefix instead).
flag_hint = "generic"

# deepseek: max | high | low | none
# glm: max | high | low (thinking is mandatory)
# luna: max | xhigh | high | medium | low | none

[[lanes]]
model = "z-ai/glm-5.3-flash"
reasoning_effort = "max"

[[lanes]]
model = "deepseek/deepseek-v4.1-flash-1017"
reasoning_effort = "max"

[[lanes]]
model = "deepseek/deepseek-v4.1-flash"
reasoning_effort = "max"

[[lanes]]
model = "xiaomi/mimo-v2.6-flash"
reasoning_effort = "max"